name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify tag and package version
        run: |
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [ "v${PACKAGE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${PACKAGE_VERSION}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: |
          set -o pipefail

          echo "Attempting npm trusted publishing (OIDC)."
          trusted_log="$(mktemp)"
          if npm publish --provenance 2>&1 | tee "${trusted_log}"; then
            exit 0
          fi

          if [ -z "${NPM_TOKEN}" ]; then
            echo "Trusted publishing failed and NPM_TOKEN is not configured." >&2
            exit 1
          fi

          if ! grep -Eq "E401|ENEEDAUTH|requires authentication|authentication token|Unable to authenticate" "${trusted_log}"; then
            echo "Trusted publishing failed for a non-auth reason. Skipping NPM_TOKEN fallback." >&2
            exit 1
          fi

          echo "Trusted publishing auth failed. Falling back to NPM_TOKEN."
          token_log="$(mktemp)"
          if NODE_AUTH_TOKEN="${NPM_TOKEN}" npm publish --provenance 2>&1 | tee "${token_log}"; then
            exit 0
          fi

          if grep -q "EOTP" "${token_log}"; then
            echo "NPM_TOKEN requires OTP. Use an npm Automation token or remove NPM_TOKEN to use trusted publishing." >&2
          fi

          exit 1
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
